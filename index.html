<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Kinematics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400;600&family=JetBrains+Mono:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#060a22;--cyan:#7fdcff;--gold:#ffe6a3;--mint:#8ff0c0;--pink:#ff94c8;--text:#cfe6ff;--bright:#f0f2ff;--label:#a9b0dc;--line:rgba(160,170,255,.5);--hair:rgba(160,170,255,.22)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:18px 24px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;height:100vh;overflow:hidden;font-family:'Exo 2',system-ui,sans-serif;font-size:14px;line-height:1.4;color:var(--text);background-color:var(--bg);background-image:linear-gradient(rgba(140,205,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(140,205,255,.07) 1px,transparent 1px);background-size:24px 24px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.ruler{flex:1;height:7px;background:linear-gradient(rgba(140,205,255,.5),rgba(140,205,255,.5)) 0 100%/100% 1px no-repeat,repeating-linear-gradient(90deg,rgba(140,205,255,.5) 0 1px,transparent 1px 8px)}
.star{color:var(--gold)}

header{display:flex;align-items:center;gap:14px}
header p{margin:0;color:var(--label)}
h1{margin:0;font-size:26px;font-weight:200;letter-spacing:.22em;text-transform:uppercase;color:var(--bright);text-shadow:0 0 22px rgba(127,220,255,.75);white-space:nowrap}

main{display:grid;grid-template-columns:minmax(260px,.82fr) minmax(440px,1.9fr) minmax(260px,.86fr);gap:20px;min-height:0}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.tilt-l{transform:perspective(1400px) rotateY(7deg);transform-origin:left center}
.tilt-r{transform:perspective(1400px) rotateY(-7deg);transform-origin:right center}
.panel{padding:14px;border:1px solid var(--line);border-radius:16px 4px 16px 4px;background:rgba(120,140,255,.08);box-shadow:inset 0 0 26px rgba(127,220,255,.16),0 0 16px rgba(127,220,255,.16)}
.panel.gold{border-color:rgba(255,230,163,.7);box-shadow:inset 0 0 26px rgba(255,230,163,.14),0 0 16px rgba(255,230,163,.14)}
h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;color:var(--cyan)}
h2 .num{color:var(--label)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;border-bottom:1px solid var(--hair)}
.row span{color:var(--label)}
.row b{font-size:18px;font-weight:300;color:var(--bright);text-align:right}
.meter-head{display:flex;justify-content:space-between;color:var(--label);margin-top:8px}
.meter{position:relative;height:12px;margin-top:4px;background:repeating-linear-gradient(90deg,rgba(160,170,255,.25) 0 calc(5% - 3px),transparent calc(5% - 3px) 5%)}
.meter i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--cyan) 0 calc(5% - 3px),transparent calc(5% - 3px) 5%);clip-path:inset(0 30% 0 0)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 6px;padding:7px;border-radius:10px 3px 10px 3px;background:rgba(120,140,255,.1)}
.tile .mono{font-size:10px;white-space:nowrap}
.tile b{text-align:right;font-size:19px;font-weight:300;color:var(--bright)}
.tile i{grid-column:1/-1;height:3px;background:linear-gradient(90deg,currentColor var(--p,0%),var(--hair) 0)}
.tile .mono{color:var(--label)}

.viewer{position:relative;flex:1;min-height:0;background:linear-gradient(var(--gold),var(--gold)) 0 0/22px 2px,linear-gradient(var(--gold),var(--gold)) 0 0/2px 22px,linear-gradient(var(--gold),var(--gold)) 100% 0/22px 2px,linear-gradient(var(--gold),var(--gold)) 100% 0/2px 22px,linear-gradient(var(--gold),var(--gold)) 0 100%/22px 2px,linear-gradient(var(--gold),var(--gold)) 0 100%/2px 22px,linear-gradient(var(--gold),var(--gold)) 100% 100%/22px 2px,linear-gradient(var(--gold),var(--gold)) 100% 100%/2px 22px;background-repeat:no-repeat}
.stage{position:absolute;inset:8px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.stage.split{grid-template-columns:minmax(0,42fr) minmax(0,58fr)}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}
.pane.bp{background-color:rgba(24,70,170,.28);background-image:linear-gradient(rgba(190,225,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(190,225,255,.14) 1px,transparent 1px),linear-gradient(rgba(190,225,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(190,225,255,.22) 1px,transparent 1px);background-size:12px 12px,12px 12px,60px 60px,60px 60px;border:1px solid rgba(190,225,255,.45)}
#fig{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;filter:drop-shadow(0 0 3px rgba(127,220,255,.5))}
#fig:active{cursor:grabbing}
#bp{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;filter:drop-shadow(0 0 3px rgba(127,220,255,.55))}
#bp:active{cursor:grabbing}
[hidden]{display:none!important}
.ov{position:absolute;margin:0;color:var(--bright);pointer-events:none}
.ov.tl{top:10px;left:12px;max-width:calc(100% - 24px);display:grid;gap:2px}.ov.tr{top:10px;right:12px;color:var(--gold)}
.ctrl{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
#fly{position:absolute;left:8px;bottom:8px}
.btn{min-height:32px;padding:0 9px;font-size:10px;border:1px solid var(--cyan);border-radius:999px;background:rgba(6,10,34,.7);color:var(--cyan);cursor:pointer}
.btn:hover,.btn:focus-visible{background:rgba(127,220,255,.18);outline:none}
.btn.main{border-color:var(--gold);color:var(--gold)}
.tag{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);padding:1px 8px;background:var(--bg);white-space:nowrap;color:var(--gold)}

.mrow{display:grid;gap:3px;padding:5px 0}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--label)}
.mh b{font-family:'Exo 2',system-ui,sans-serif;font-size:16px;font-weight:300;letter-spacing:0;text-transform:none;color:var(--bright)}
.track{position:relative;height:12px;border-left:1px solid var(--line);background:rgba(160,170,255,.1)}
.bar{position:absolute;left:0;top:0;bottom:0;min-width:2px;background:var(--cyan);border-radius:0 4px 4px 0}
.track.log{border-left:0;background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.dot{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 2px var(--bg)}
.tick{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--bright);opacity:.75}
.tick::after{content:"";position:absolute;inset:-4px -5px}
.key{margin:6px 0 0;font-size:12px;color:var(--label)}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.cell{display:grid;gap:5px;padding:6px;border:1px solid var(--line);border-radius:16px 4px 16px 4px;background:rgba(120,140,255,.08);box-shadow:inset 0 0 20px rgba(127,220,255,.12);color:var(--text);cursor:pointer;text-align:left;font-family:'Exo 2',system-ui,sans-serif}
.cell:hover,.cell:focus-visible{border-color:var(--cyan);outline:none}
.cell[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,230,163,.1);box-shadow:inset 0 0 20px rgba(255,230,163,.14),0 0 14px rgba(255,230,163,.3)}
.cover{display:block;height:52px;border:1px solid rgba(190,225,255,.45);background-color:rgba(24,70,170,.28);background-image:linear-gradient(rgba(190,225,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(190,225,255,.16) 1px,transparent 1px);background-size:12px 12px}
.cover canvas,.cover svg{display:block;width:100%;height:100%}
.meta{display:flex;align-items:baseline;gap:6px;min-width:0}
.meta .id{color:var(--gold)}
.meta .nm{font-size:13px;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{flex:1;min-height:0;overflow:auto;display:grid;gap:8px;align-content:start}
.detail h3{margin:0;font-size:18px;font-weight:300;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.detail p{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.kv dt{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.kv dd{margin:0;text-align:right;color:var(--bright)}

.strip{display:grid;gap:8px}
.strip p{margin:0;padding:8px 14px;border:1px solid var(--line);border-radius:16px 4px 16px 4px;font-size:13px}
.strip b{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;color:var(--cyan)}
.strip .risk{border-color:var(--pink)}.strip .risk b{color:var(--pink)}
.strip .out{border-style:dashed}.strip .out b{color:var(--label)}

/* v3 */
/* zoomable cells, after the Desk HUD: a cell lifts out, grows into the middle, and its text prints in */
.zcell{cursor:zoom-in}
.zcell h2{position:relative;white-space:nowrap}
.zbtn{min-height:24px;min-width:24px;font-size:12px;margin-left:2px}
#info{position:relative}
.info-z{position:absolute;top:10px;right:10px}
#info h3{margin-right:30px}
#veil{position:fixed;inset:0;z-index:20;background:rgba(2,4,16,.72);display:grid;place-items:center}
#zoom{position:relative;width:min(1040px,86vw);height:min(640px,84vh);display:flex;flex-direction:column;gap:10px;padding:20px 22px;cursor:default;
  background:rgba(10,16,48,.96);border-color:rgba(255,230,163,.7);box-shadow:inset 0 0 40px rgba(127,220,255,.16),0 0 40px rgba(127,220,255,.25)}
#zClose{position:absolute;top:12px;right:12px;z-index:2}
#zBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
#zBody .zbtn,#zBody .info-z{display:none}
#zBody h2{font-size:14px;margin-right:44px}
#zBody .tiles{gap:14px}
#zBody #forcePanel-x{}
#zBody .tile{padding:14px 16px}
#zBody .tile .mono{font-size:12px}
#zBody .tile b{font-size:34px}
#zBody .only-big{display:block}
.only-big{display:none}
.eq{margin:0;padding:12px 16px;border:1px dashed var(--line);border-radius:12px 3px 12px 3px;font-size:15px;line-height:1.7}
.eq b{color:var(--bright);font-weight:400}
.eq .mono{color:var(--label)}
#zBody .meter{height:16px}
#zBody .read{font-size:16px}
#zBody #tsv{flex:1;min-height:0}
#zBody .mrow{padding:8px 0}
#zBody .mh{font-size:13px}
#zBody .mh b{font-size:22px}
#zBody .track{height:16px}
#zBody #metKey{display:block;font-size:14px}
#metPanel #metKey{display:none}
.tkey{display:inline-block;width:2px;height:9px;margin:0 2px -1px;background:var(--bright);opacity:.75}
#zBody .bpslot{flex:1}
#zBody .bpslot .ov{display:grid}
#zBody .bpslot .ov.tr{display:block}
#zBody .bpslot .ctrl{display:flex}
#zBody .bphead{margin-right:44px}
#zBody h3{font-size:24px}
#zBody p,#zBody .kv{font-size:17px}
#zBody .kv dt{font-size:13px}
.print{animation:printIn .3s steps(6,end) both}
@keyframes printIn{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
#snd[aria-pressed="false"]{border-color:var(--label);color:var(--label)}
@media (prefers-reduced-motion:reduce){.print{animation:none}}
.detail{font-size:13px;gap:6px}
.detail h3{font-size:16px}
.kv dt{white-space:nowrap}
.panel.tight{padding:11px 13px}
#forcePanel .tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#forcePanel .tile{grid-template-columns:1fr;gap:1px;padding:5px 6px}
#forcePanel .tile .mono{font-size:9px}
#forcePanel .tile b{text-align:left;font-size:16px}
#forcePanel .meter-head{margin-top:6px}
#chartPanel{flex:1 1 0;min-height:120px;display:flex;flex-direction:column}
#tsv{flex:1;min-height:0;width:100%;display:block;cursor:crosshair}
.read{margin:0 0 4px;font-size:12px;color:var(--text)}
#metPanel .mrow{padding:2px 0}
#metPanel .key{margin-top:3px;font-size:11px}
.col.tilt-l{gap:10px}
#metPanel .mh b{font-size:15px}
.stage .pane{position:absolute;inset:0}
.bpslot{position:relative;flex:1;min-height:0}
.bpslot > .pane{position:absolute;inset:0}
.bpslot .ov,.bpslot .att,.bpslot #fly,.bpslot .ctrl{display:none}
#bpPanel{flex:0 0 190px;display:flex;flex-direction:column;gap:8px}
.bphead{display:flex;align-items:center;gap:8px}
.bphead h2{flex:1;margin:0}
.tabs{display:flex;gap:4px}
.tab{min-height:28px;padding:0 8px;border:1px solid var(--hair);border-radius:999px;background:none;color:var(--label);cursor:pointer}
.tab[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.tab:hover,.tab:focus-visible{border-color:var(--cyan);outline:none}
.btn.icon{min-width:32px;padding:0;font-size:14px}
.rings{display:flex;justify-content:space-around;gap:6px}.rings figure{margin:0;display:grid;justify-items:center;gap:3px}.rings figcaption{font-size:9px;color:var(--label)}
.ring{width:76px;height:76px;display:block;overflow:visible}.ring .sg{fill:none;stroke-width:6;stroke:rgba(160,170,255,.16)}.ring .tk{stroke:rgba(127,220,255,.28);stroke-width:1}.ring .tk.big{stroke:rgba(127,220,255,.55)}
.ring .num{fill:var(--bright);font-family:'Exo 2',sans-serif;font-weight:300;font-size:22px}.ring .unit{font-size:11px}
#outPanel{flex:none}
/* alert plate over the viewer */
.kplate{position:absolute;top:12px;left:120px;right:236px;width:max-content;max-width:calc(100% - 356px);margin:0 auto;z-index:3;display:grid;grid-template-columns:22px minmax(0,auto);border:1px solid rgba(255,230,163,.8);border-radius:9px 2px 9px 2px;overflow:hidden;background:rgba(30,24,10,.75);box-shadow:0 0 16px rgba(255,230,163,.25);pointer-events:none}
.kplate i{background:repeating-linear-gradient(-45deg,var(--gold) 0 6px,rgba(6,10,36,.9) 6px 12px)}
.kplate b{padding:6px 12px;font-size:11px;letter-spacing:.14em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kplate.red{border-color:rgba(255,148,200,.85);box-shadow:0 0 16px rgba(255,148,200,.3)}.kplate.red i{background:repeating-linear-gradient(-45deg,#ff94c8 0 6px,rgba(6,10,36,.9) 6px 12px)}.kplate.red b{color:#ff94c8}
.kplate::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,230,163,.16),transparent);animation:ksweep 2.6s linear infinite}
@keyframes ksweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.kplate::after{animation:none;opacity:0}}
/* heading dial, beside the pitch and bank dial */
.hdg{position:absolute;top:10px;right:124px;display:grid;justify-items:center;gap:4px;pointer-events:none}.hdg canvas{width:96px;height:96px;display:block}.hdg p{margin:0;color:var(--text);font-size:10px;text-align:center;line-height:1.5}
.bpslot .hdg,.bpslot .kplate{display:none}
.att{position:absolute;top:10px;right:12px;display:grid;justify-items:center;gap:4px;pointer-events:none}
.att canvas{width:96px;height:96px;display:block}
.att p{margin:0;color:var(--text);font-size:10px;text-align:center;line-height:1.5}
.cells{display:grid;grid-template-columns:4fr 6fr;gap:16px}
.grp{display:grid;gap:5px;min-width:0}
.glab{color:var(--label);font-size:10px}
.gcells{display:grid;gap:8px}
.gcells.t{grid-template-columns:repeat(4,minmax(0,1fr))}
.gcells.w{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:999px),(max-height:599px){
  body{height:auto;min-height:100vh;overflow:auto}
  main{grid-template-columns:1fr}
  .cells{grid-template-columns:1fr}
  .gcells.t,.gcells.w{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
  #bpPanel{flex-basis:280px}
  .tilt-l,.tilt-r{transform:none}
  .viewer{flex:none;height:560px}
  .detail{overflow:visible}
}
</style>
</head>
<body>

<header>
<p class="mono"><span class="star" aria-hidden="true">✦</span> Free Flight Simulation</p>
<h1>Kestrel Kinematics</h1>
<div class="ruler"></div>
<button class="btn mono" id="snd" type="button" aria-pressed="true">Sound on</button>
<p class="mono" id="hdrSum">ΣT 1,400 N · Mass 100 kg · Concept estimates</p>
</header>

<main>
<div class="col tilt-l">
<section class="panel tight zcell" id="forcePanel" data-name="Live forces">
<h2 class="mono"><span class="star" aria-hidden="true">✦</span>Forces · N<span class="ruler"></span><span class="num">Throttle <b style="color:var(--bright)" id="vThr">–</b></span><button class="btn icon zbtn mono" type="button" aria-label="Enlarge live forces">⤢</button></h2>
<div class="tiles">
<div class="tile" style="color:#ffe6a3"><span class="mono">Thrust</span><b id="vT">–</b><i id="bT"></i></div>
<div class="tile" style="color:#ff94c8"><span class="mono">Weight</span><b id="vW">–</b><i id="bW"></i></div>
<div class="tile" style="color:#8ff0c0"><span class="mono">Lift</span><b id="vL">–</b><i id="bL"></i></div>
<div class="tile" style="color:#ffa24c"><span class="mono">Drag</span><b id="vD">–</b><i id="bD"></i></div>
</div>
<div class="meter only-big"><i id="mThr"></i></div>
<p class="eq only-big" id="eq"></p>
</section>
<section class="panel tight zcell" id="chartPanel" data-name="Thrust needed vs speed">
<h2 class="mono"><span class="star" aria-hidden="true">✦</span>Thrust vs speed<span class="ruler"></span><button class="btn icon zbtn mono" type="button" aria-label="Enlarge chart">⤢</button></h2>
<p class="read" id="tsvRead"></p>
<canvas id="tsv" role="img" aria-label="Line chart of thrust needed against airspeed for the selected setup, with the available thrust as a dashed line."></canvas>
</section>
<section class="panel tight zcell" id="metPanel" data-name="Metrics">
<h2 class="mono"><span class="star" aria-hidden="true">✦</span><span id="metTitle">Metrics</span><span class="ruler"></span><span class="num">Est. · <i class="tkey" aria-hidden="true"></i> compare</span><button class="btn icon zbtn mono" type="button" aria-label="Enlarge metrics">⤢</button></h2>
<div id="metRows"></div>
<p class="key" id="metKey"></p>
</section>
</div>

<div class="col">
<div class="viewer">
<div class="stage" id="stage">
<div class="pane" id="pFig">
<canvas id="fig" aria-label="3D mannequin wearing the selected setup, with force arrows."></canvas>
<p class="ov tl mono" id="flight"><span id="fAlt"></span><span id="fSpd"></span><span id="fThr"></span><span id="fState" style="color:var(--gold)"></span></p>
<div class="att" id="att"><canvas id="attC" aria-hidden="true"></canvas><p class="mono" id="attTxt"></p></div>
<div class="hdg" id="hdg"><canvas id="hdgC" aria-hidden="true"></canvas><p class="mono" id="hdgTxt"></p></div>
<div class="kplate mono" id="kAlert" role="alert" hidden><i></i><b id="kAlertT"></b></div>
<button class="btn main mono" id="fly" type="button">Hold</button>
</div>
</div>
<span class="tag mono" id="tag"></span>
</div>
</div>

<div class="col tilt-r">
<section class="panel tight zcell" id="bpPanel" data-name="Blueprint">
<div class="bphead">
<h2 class="mono"><span class="star" aria-hidden="true">✦</span><span id="bpHead">Blueprint</span></h2>
<div class="tabs" id="tabs"><button class="tab mono" type="button" data-view="t" aria-pressed="true">Thruster</button><button class="tab mono" type="button" data-view="w" aria-pressed="false">Wing</button></div>
<button class="btn icon zbtn mono" type="button" aria-label="Enlarge blueprint">⤢</button>
</div>
<div class="bpslot" id="bpSlot">
<div class="pane bp" id="pBp">
<canvas id="bp" aria-label="Rotating blueprint of the selected part with component labels."></canvas>
<p class="ov tl mono" id="bpTitle"></p>
<p class="ov tr mono" id="bpView"></p>
<div class="ctrl" id="bpCtrl">
<button class="btn main mono" id="spin" type="button">Pause</button>
<button class="btn mono" type="button" data-yaw="0">Front</button>
<button class="btn mono" type="button" data-yaw="90">Side</button>
<button class="btn mono" type="button" data-yaw="180">Back</button>
<button class="btn mono" type="button" data-zoom="0.8" aria-label="Zoom out">−</button>
<button class="btn mono" type="button" data-zoom="1.25" aria-label="Zoom in">+</button>
</div>
</div>
</div>
</section>
<section class="panel tight" id="outPanel" aria-label="Output">
<h2 class="mono"><span class="star" aria-hidden="true">✦</span>Output<span class="ruler"></span><span class="num" id="outTW">–</span></h2>

<script>
/* ---------- wireframe geometry (y is up, exhaust points down) ---------- */
const TAU = Math.PI * 2;
function ring(y, r, n = 36) {
  const p = [];
  for (let i = 0; i <= n; i++) { const a = i / n * TAU; p.push([r * Math.cos(a), y, r * Math.sin(a)]); }
  return p;
}
function revolve(profile, nLong = 12, c = 'main') {
  const out = profile.map(([y, r]) => ({ pts: ring(y, r), c }));
  for (let i = 0; i < nLong; i++) {
    const a = i / nLong * TAU;
    out.push({ pts: profile.map(([y, r]) => [r * Math.cos(a), y, r * Math.sin(a)]), c });
  }
  return out;
}
function radial(y0, r0, y1, r1, n, twist = 0, c = 'accent') {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    out.push({ pts: [[r0 * Math.cos(a), y0, r0 * Math.sin(a)], [r1 * Math.cos(a + twist), y1, r1 * Math.sin(a + twist)]], c });
  }
  return out;
}
function mesh(y, r, c = 'accent') {
  const out = [{ pts: ring(y, r), c }];
  for (const t of [-0.6, -0.2, 0.2, 0.6]) {
    const h = Math.sqrt(1 - t * t) * r;
    out.push({ pts: [[t * r, y, -h], [t * r, y, h]], c });
    out.push({ pts: [[-h, y, t * r], [h, y, t * r]], c });
  }
  return out;
}
function tankX(x0, x1, cy, r, c = 'main') {
  const prof = [[x0 - 0.2, r * 0.25], [x0 - 0.12, r * 0.7], [x0, r], [x1, r], [x1 + 0.12, r * 0.7], [x1 + 0.2, r * 0.25]];
  const out = [];
  for (const [x, rr] of prof) {
    const p = [];
    for (let i = 0; i <= 24; i++) { const a = i / 24 * TAU; p.push([x, cy + rr * Math.cos(a), rr * Math.sin(a)]); }
    out.push({ pts: p, c });
  }
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    out.push({ pts: prof.map(([x, rr]) => [x, cy + rr * Math.cos(a), rr * Math.sin(a)]), c });
  }
  return out;
}
function hose(P, r, c = 'main') {
  const N = 16, cs = [], ns = [], out = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    const b = k => u * u * u * P[0][k] + 3 * u * u * t * P[1][k] + 3 * u * t * t * P[2][k] + t * t * t * P[3][k];
    const d = k => 3 * u * u * (P[1][k] - P[0][k]) + 6 * u * t * (P[2][k] - P[1][k]) + 3 * t * t * (P[3][k] - P[2][k]);
    const dx = d(0), dy = d(1), L = Math.hypot(dx, dy) || 1;
    cs.push([b(0), b(1)]); ns.push([-dy / L, dx / L]);
  }
  const at = (i, a) => [cs[i][0] + ns[i][0] * r * Math.cos(a), cs[i][1] + ns[i][1] * r * Math.cos(a), r * Math.sin(a)];
  for (let i = 0; i <= N; i++) {
    const p = [];
    for (let k = 0; k <= 16; k++) p.push(at(i, k / 16 * TAU));
    out.push({ pts: p, c });
  }
  for (const a of [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2]) out.push({ pts: cs.map((q, i) => at(i, a)), c });
  return out;
}

const D2R = Math.PI / 180;
const wingO = t => { const a = (214.8 - t * 249.6) * D2R; return [Math.cos(a), Math.sin(a)]; };
const wingI = t => { const a = (195.1 - t * 210.2) * D2R; return [0.85 * Math.cos(a), -0.35 + 0.85 * Math.sin(a)]; };
function wingP(t, s, side) {
  const o = wingO(t), i = wingI(t), c = Math.hypot(o[0] - i[0], o[1] - i[1]);
  return [o[0] + s * (i[0] - o[0]), o[1] + s * (i[1] - o[1]), side * 0.07 * c * 4 * s * (1 - s) * (1.3 - s)];
}
function crescent() {
  const N = 36, out = [];
  const span = (s, side, c) => ({ pts: Array.from({ length: N + 1 }, (_, k) => wingP(k / N, s, side)), c });
  out.push(span(0, 0, 'main'), span(1, 0, 'main'));
  for (const s of [0.25, 0.5, 0.75]) for (const side of [1, -1]) out.push(span(s, side, 'main'));
  for (let k = 0; k <= 12; k++) for (const side of [1, -1]) out.push({ pts: Array.from({ length: 9 }, (_, j) => wingP(k / 12, j / 8, side)), c: 'main' });
  out.push(span(0.3, 0, 'accent'));
  for (const [a, b] of [[0.06, 0.3], [0.7, 0.94]]) {
    out.push({ pts: Array.from({ length: 11 }, (_, k) => wingP(a + (b - a) * k / 10, 0.72, 1)), c: 'accent' });
    for (const t of [a, b]) out.push({ pts: [wingP(t, 0.72, 1), wingP(t, 1, 0)], c: 'accent' });
  }
  out.push({ pts: [[-0.12, 0.92, -0.1], [0.12, 0.92, -0.1], [0.12, 0.58, -0.1], [-0.12, 0.58, -0.1], [-0.12, 0.92, -0.1]], c: 'accent' });
  for (const x of [-0.12, 0.12]) for (const y of [0.92, 0.58]) out.push({ pts: [[x, y, -0.1], [x, y, 0]], c: 'accent' });
  return out;
}

function delta() {
  const N = 24, out = [];
  const LE = u => 1 - 1.4 * Math.abs(u), TE = u => -0.25 - 0.15 * Math.abs(u);
  const P = (u, s, side) => { const c = LE(u) - TE(u); return [u, LE(u) - s * c, side * 0.05 * c * 4 * s * (1 - s) * (1.3 - s)]; };
  const span = (s, side, c, a = -1, b = 1) => ({ pts: Array.from({ length: N + 1 }, (_, k) => P(a + (b - a) * k / N, s, side)), c });
  out.push(span(0, 0, 'main'), span(1, 0, 'main'));
  for (const s of [0.25, 0.5, 0.75]) for (const side of [1, -1]) out.push(span(s, side, 'main'));
  for (let k = -6; k <= 6; k++) for (const side of [1, -1]) out.push({ pts: Array.from({ length: 9 }, (_, j) => P(k / 6, j / 8, side)), c: 'main' });
  out.push(span(0.35, 0, 'accent'));
  for (const [a, b] of [[-0.85, -0.2], [0.2, 0.85]]) {
    out.push(span(0.75, 1, 'accent', a, b));
    for (const u of [a, b]) out.push({ pts: [P(u, 0.75, 1), P(u, 1, 0)], c: 'accent' });
  }
  for (const x of [-0.95, 0.95]) out.push({ pts: [[x, -0.12, 0], [x, -0.42, 0.26], [x, -0.46, 0], [x, -0.12, 0]], c: 'accent' });
  out.push({ pts: [[-0.12, 0.75, -0.1], [0.12, 0.75, -0.1], [0.12, 0.35, -0.1], [-0.12, 0.35, -0.1], [-0.12, 0.75, -0.1]], c: 'accent' });
  for (const x of [-0.12, 0.12]) for (const y of [0.75, 0.35]) out.push({ pts: [[x, y, -0.1], [x, y, 0]], c: 'accent' });
  return out;
}

function wingMesh({ LE, TE, half = 1, z0 = 0, th = 0.09, spar = 0.35, elev = [], hy = null }) {
  const N = 24, out = [];
  const P = (u, s, side) => { const c = LE(u) - TE(u); return [u * half, LE(u) - s * c, z0 + side * th * c * 4 * s * (1 - s) * (1.3 - s)]; };
  const span = (s, side, c, a = -1, b = 1) => ({ pts: Array.from({ length: N + 1 }, (_, k) => P(a + (b - a) * k / N, s, side)), c });
  out.push(span(0, 0, 'main'), span(1, 0, 'main'));
  for (const s of [0.25, 0.5, 0.75]) for (const side of [1, -1]) out.push(span(s, side, 'main'));
  for (let k = -6; k <= 6; k++) for (const side of [1, -1]) out.push({ pts: Array.from({ length: 9 }, (_, j) => P(k / 6, j / 8, side)), c: 'main' });
  out.push(span(spar, 0, 'accent'));
  for (const [a, b] of elev) {
    out.push(span(0.75, 1, 'accent', a, b));
    for (const u of [a, b]) out.push({ pts: [P(u, 0.75, 1), P(u, 1, 0)], c: 'accent' });
  }
  if (hy !== null) {
    const zb = z0 - 0.1;
    out.push({ pts: [[-0.12, hy, zb], [0.12, hy, zb], [0.12, hy - 0.3, zb], [-0.12, hy - 0.3, zb], [-0.12, hy, zb]], c: 'accent' });
    for (const x of [-0.12, 0.12]) for (const y of [hy, hy - 0.3]) out.push({ pts: [[x, y, zb], [x, y, z0]], c: 'accent' });
  }
  return out;
}
const tapLE = u => 0.75 - 0.12 * Math.abs(u), tapTE = u => 0.2 + 0.13 * Math.abs(u);
function tapered() { return wingMesh({ LE: tapLE, TE: tapTE, elev: [[-0.9, -0.45], [0.45, 0.9]], hy: 0.62 }); }
function folding() {
  const out = wingMesh({ LE: tapLE, TE: tapTE, elev: [[-0.9, -0.45], [0.45, 0.9]], hy: 0.62 });
  const c = Math.cos(110 * D2R), sn = Math.sin(110 * D2R);
  for (const sg of [1, -1]) {
    out.push({ pts: [[0.4 * sg, tapLE(0.4), 0], [0.4 * sg, tapTE(0.4), 0]], c: 'accent' });
    const f = (u, y) => [sg * (0.4 + (u - 0.4) * c), y, (u - 0.4) * sn];
    out.push({ pts: [f(0.4, tapLE(0.4)), f(1, tapLE(1)), f(1, tapTE(1)), f(0.4, tapTE(0.4))], c: 'accent' });
    out.push({ pts: [f(0.7, tapLE(0.7)), f(0.7, tapTE(0.7))], c: 'accent' });
  }
  return out;
}
function boxwing() {
  const fLE = u => 0.95 - 0.25 * Math.abs(u), rLE = u => 0.25 * Math.abs(u);
  const out = [
    ...wingMesh({ LE: fLE, TE: u => fLE(u) - 0.5, half: 0.85, z0: 0.14, th: 0.07, elev: [[-0.9, -0.4], [0.4, 0.9]], hy: 0.8 }),
    ...wingMesh({ LE: rLE, TE: u => rLE(u) - 0.5, half: 0.85, z0: -0.06, th: 0.07 })
  ];
  for (const x of [-0.85, 0.85]) out.push({ pts: [[x, 0.7, 0.14], [x, 0.2, 0.14], [x, -0.25, -0.06], [x, 0.25, -0.06], [x, 0.7, 0.14]], c: 'accent' });
  return out;
}

let PRINTBUF = null, PRINTLOUD = [];
async function loadPrint() {
  if (PRINTBUF || !AC) return;

    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);

    for (let i = 0; i < d.length; i += st) { let m = 0; for (let j = i; j < Math.min(d.length, i + st); j++) m = Math.max(m, Math.abs(d[j])); e.push(m); }

  close() { tone(820, 0.16, { f2: 260, vol: 0.14 }); hiss(0.2, 3200, 400, 0.05); },
  print(n, start) { if (playPrint((35 * Math.max(1, n / 2) + 340) / 1000, start == null ? 0.17 : start)) return; n = Math.min(26, n || 12); for (let i = 0; i < n; i++) tone(1700 + Math.random() * 1100, 0.016, { type: 'square', vol: 0.035, at: (start == null ? 0.17 : start) + i * 0.032 + Math.random() * 0.012 }); },

const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* text prints in, line by line, with the printing sound */
function printIn(root, sel, start) {
  const els = [...root.querySelectorAll(sel)].filter(e => e.offsetParent !== null);
  if (!REDUCE) els.forEach((e, k) => { e.classList.remove('print'); void e.offsetWidth; e.classList.add('print'); e.style.animationDelay = ((start == null ? 170 : start) + 35 * k) + 'ms'; });

    ctx.fillText(l.txt, tx, l.y);
  }
  ctx.textBaseline = 'alphabetic';
  const deg = ((Math.round(yaw * 180 / Math.PI) % 360) + 360) % 360;
  const side = deg < 45 || deg >= 315 ? 'Front' : deg < 135 ? 'Right' : deg < 225 ? 'Back' : 'Left';
  $('bpView').textContent = side + ' · ' + String(deg).padStart(3, '0') + '° · ×' + zoom.toFixed(1);
}

/* ---------- zoom: a cell lifts out of its place, grows into the middle, and its text prints in ---------- */
const flip = (a, b) => `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})`;
let ZFROM = null, ZKIDS = [];
function openZoom(cell) {
  if (ZOPEN) return;
  ZOPEN = cell.id; ZFROM = cell; ZKIDS = [...cell.childNodes];
  const v = $('veil'), z = $('zoom'), body = $('zBody');
  ZKIDS.forEach(n => body.append(n));
  z.setAttribute('aria-label', cell.dataset.name);
  v.hidden = false; cell.style.visibility = 'hidden';
  SFX.open(); printIn(body, 'h2, h3, p, .tile, .mrow, dt, dd, .bphead', 170);
  if (!REDUCE && z.animate) {
    const a = cell.getBoundingClientRect(), b = z.getBoundingClientRect();
    z.animate([{ transformOrigin: '0 0', transform: flip(a, b), opacity: 0.55 }, { transformOrigin: '0 0', transform: 'none', opacity: 1 }], { duration: 340, easing: 'cubic-bezier(.2,.8,.2,1)' });
    v.animate([{ backgroundColor: 'rgba(2,4,16,0)' }, { backgroundColor: 'rgba(2,4,16,.72)' }], { duration: 340 });
  }
  $('zClose').focus();
}
function closeZoom() {
  if (!ZOPEN) return;
  const cell = ZFROM, v = $('veil'), z = $('zoom');
  ZOPEN = null; SFX.close();
  const done = () => { ZKIDS.forEach(n => cell.append(n)); v.hidden = true; cell.style.visibility = ''; const b = cell.querySelector('.zbtn'); if (b) b.focus(); };
  if (!REDUCE && z.animate) {
    const a = cell.getBoundingClientRect(), b = z.getBoundingClientRect();
    z.animate([{ transformOrigin: '0 0', transform: 'none', opacity: 1 }, { transformOrigin: '0 0', transform: flip(a, b), opacity: 0.4 }], { duration: 260, easing: 'cubic-bezier(.4,0,.6,1)' }).onfinish = done;
    v.animate([{ backgroundColor: 'rgba(2,4,16,.72)' }, { backgroundColor: 'rgba(2,4,16,0)' }], { duration: 260 });
  } else done();
}
let PDOWN = null;
for (const cell of document.querySelectorAll('.zcell')) {
  cell.addEventListener('pointerdown', e => { PDOWN = [e.clientX, e.clientY]; });
  cell.addEventListener('click', e => {
    if (ZOPEN) return;
    const moved = PDOWN && Math.hypot(e.clientX - PDOWN[0], e.clientY - PDOWN[1]) > 5;
    if (e.target.closest('.zbtn')) { openZoom(cell); return; }
    if (moved || e.target.closest('button, a, input')) return;
    openZoom(cell);
  });
}
$('zClose').addEventListener('click', closeZoom);
$('veil').addEventListener('click', e => { if (e.target === $('veil')) closeZoom(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });
function setSound(on) {
  SOUND = on; $('snd').setAttribute('aria-pressed', String(on)); $('snd').textContent = on ? 'Sound on' : 'Sound off';
  try { localStorage.setItem('kk-sound', on ? 'on' : 'off'); } catch (e) {}
}
$('snd').addEventListener('click', () => { setSound(!SOUND); SFX.tap(); });

/* ---------- events ---------- */
$('cells').addEventListener('click', e => {
  const b = e.target.closest('.cell'); if (!b) return;
  if (b.dataset.kind === 't') { thr = b.dataset.id; view = 't'; } else { wng = b.dataset.id; view = 'w'; }
  SFX.tap(); update();
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { view = b.dataset.view; SFX.tap(); update(); } });
$('spin').addEventListener('click', () => { setSpin(!paused); SFX.tap(); });
$('fly').addEventListener('click', () => { setFly(!flying); flying ? SFX.launch() : SFX.drop(); });
$('bpCtrl').addEventListener('click', e => {
  const b = e.target.closest('[data-yaw]');
  if (b) { yaw = b.dataset.yaw * Math.PI / 180; pitch = 0.3; setSpin(true); SFX.tap(); }
  const z = e.target.closest('[data-zoom]');
  if (z) { zoom = Math.max(0.5, Math.min(4, zoom * z.dataset.zoom)); SFX.tap(); }
});
cv.addEventListener('wheel', e => { if (!$('zBody').contains($('pBp'))) return; e.preventDefault(); zoom = Math.max(0.5, Math.min(4, zoom * Math.exp(-e.deltaY * 0.0015))); }, { passive: false });
window.addEventListener('resize', thumbs);
const tsv = $('tsv');
tsv.addEventListener('pointermove', e => { const r = tsv.getBoundingClientRect(); hoverV = Math.max(0, Math.min(VMAX, (e.clientX - r.left - CH.L) / CH.pw * VMAX)); });
tsv.addEventListener('pointerleave', () => { hoverV = null; });
const fgc = $('fig');
fgc.addEventListener('pointerdown', e => { fdrag = { x: e.clientX, y: e.clientY }; fgc.setPointerCapture(e.pointerId); });
fgc.addEventListener('pointermove', e => {
  if (!fdrag) return;
  fyaw += (e.clientX - fdrag.x) * 0.01;
  fpitch = Math.max(-1.2, Math.min(1.2, fpitch + (e.clientY - fdrag.y) * 0.01));
  fdrag = { x: e.clientX, y: e.clientY };
});
for (const ev of ['pointerup', 'pointercancel']) fgc.addEventListener(ev, () => { fdrag = null; });
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  yaw += (e.clientX - drag.x) * 0.01;
  pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - drag.y) * 0.01));
  drag = { x: e.clientX, y: e.clientY };
});
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, () => { drag = null; });

setSpin(paused); setFly(flying); setSound(SOUND);
if (reduce) ft = PERIOD / 4;
update();
READY = true;
thumbs();
requestAnimationFrame(frame);
</script>
</body>
</html>
